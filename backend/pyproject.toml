[project]
name = "aimesis-backend"
version = "0.1.0"
description = "Pediatric CINV Clinical Decision Support & Patient Companion API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "langgraph>=1.2.18",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
